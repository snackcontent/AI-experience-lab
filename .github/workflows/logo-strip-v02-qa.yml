name: Logo Strip V02 accessibility and responsive QA
on:
  push:
    branches: [development]
    paths:
      - 'AI Experience Lab.dc.html'
      - '.github/workflows/logo-strip-v02-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium Playwright
        run: |
          mkdir -p /tmp/ai-lab-logo
          cd /tmp/ai-lab-logo
          npm init -y >/dev/null
          npm install --no-save --silent playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            npx playwright install --with-deps chromium
          fi
      - name: Validate logo strip animation, brand images, accessible names and manual scrolling
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/ai-lab-logo/test.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const assert=(condition,msg)=>{if(!condition)throw new Error('LOGO QA FAIL '+msg);console.log('PASS',msg)};
          const url='https://raw.githack.com/snackcontent/AI-experience-lab/'+process.env.COMMIT_SHA+'/AI%20Experience%20Lab.dc.html#o2-top';
          async function open(page){
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            const notice=page.getByRole('button',{name:'Open the page'});
            if(await notice.count() && (await page.title()).includes('External Content Notice'))await notice.click();
            await page.waitForSelector('#o2-network .o2-network__viewport',{timeout:60000});
            await page.waitForTimeout(900);
          }
          (async()=>{
            const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
            const browser=await chromium.launch({headless:true,...(exe?{executablePath:exe}:{}),args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:900}});
              page.on('pageerror',err=>console.log('PAGE ERROR',err.message));
              await open(page);
              const network=page.locator('#o2-network');
              assert(await network.count()===1,'V02 network present');
              assert(await network.getAttribute('aria-labelledby')==='o2-network-title','section labelled by visible h2');
              const assetChecks=await page.locator('#o2-network .o2-network__group[role="list"] img').evaluateAll(async imgs=>{
                const names=imgs.map(img=>img.alt);
                const checks=await Promise.all(imgs.map(async img=>{
                  if(!img.complete)await new Promise(ok=>{img.addEventListener('load',ok,{once:true});img.addEventListener('error',ok,{once:true});setTimeout(ok,6000)});
                  return {name:img.alt,source:img.getAttribute('src'),width:img.naturalWidth,height:img.naturalHeight};
                }));
                return {names,checks};
              });
              console.log('LOGO ASSETS',JSON.stringify(assetChecks.checks));
              assert(assetChecks.checks.length===10,'exactly ten official source logos');
              assert(new Set(assetChecks.names).size===10,'ten distinct brand names');
              assert(assetChecks.checks.every(x=>x.width>0&&x.height>0),'all ten logo assets load successfully');
              const widths=[320,390,768,1024,1440];
              for(const width of widths){
                await page.setViewportSize({width,height:900});
                await page.waitForTimeout(230);
                for(const lang of ['en','ar']){
                  const current=await page.locator('html').getAttribute('lang');
                  if(current!==lang){await page.locator('.o2-hdr-language').click();await page.waitForTimeout(470)}
                  await network.scrollIntoViewIfNeeded();
                  await page.waitForTimeout(400);
                  const state=await network.evaluate(el=>{
                    const q=s=>el.querySelector(s),r=e=>e.getBoundingClientRect(),viewport=q('.o2-network__viewport'),track=q('.o2-network__track'),logo=q('.o2-network__logo');
                    return {
                      pageWidth:document.documentElement.scrollWidth,
                      viewportWidth:innerWidth,
                      heading:q('h2').textContent.trim(),
                      headingId:q('h2').id,
                      headingLine:r(q('h2')).x,
                      containerLine:r(q('.o2-network__heading')).x,
                      primaryImgs:el.querySelectorAll('.o2-network__group[role="list"] img[alt]').length,
                      duplicatedImgs:el.querySelectorAll('.o2-network__duplicate img').length,
                      cloneHidden:q('.o2-network__duplicate').getAttribute('aria-hidden'),
                      cloneInert:q('.o2-network__duplicate').hasAttribute('inert'),
                      animation:getComputedStyle(track).animationName,
                      playState:getComputedStyle(track).animationPlayState,
                      fade:getComputedStyle(q('.o2-network__fade')).maskImage,
                      cardFilter:getComputedStyle(logo).filter,
                      cardOpacity:getComputedStyle(logo).opacity,
                      cardFit:getComputedStyle(logo).objectFit,
                      cardBackdrop:getComputedStyle(q('.o2-network__card')).backdropFilter,
                      viewportTab:viewport.getAttribute('tabindex'),
                      staticMode:el.getAttribute('data-static')
                    };
                  });
                  console.log('LOGO LAYOUT',JSON.stringify({width,lang,state}));
                  assert(state.pageWidth<=width+1,'no horizontal page overflow '+width+'/'+lang);
                  assert(state.heading===(lang==='en'?'Across our network':'عبر شبكتنا'),'localized semantic heading '+width+'/'+lang);
                  assert(state.primaryImgs===10 && state.duplicatedImgs===10 && state.cloneHidden==='true' && state.cloneInert,'only primary ten logos announced '+width+'/'+lang);
                  assert(state.cardFilter==='none' && state.cardOpacity==='1' && state.cardFit==='contain','native asset colors and proportions '+width+'/'+lang);
                  assert(state.cardBackdrop==='none','no repeated per-card backdrop-filter '+width+'/'+lang);
                  assert(state.staticMode==='false' && state.animation!=='none' && state.viewportTab==='-1','autoplay marquee with hidden manual tab stop '+width+'/'+lang);
                  const toggle=network.locator('.o2-network__toggle');
                  assert((await toggle.innerText()).includes(lang==='en'?'Pause':'إيقاف'),'localized visible pause control '+width+'/'+lang);
                  await toggle.click();
                  const pause=await network.evaluate(el=>{
                    const view=el.querySelector('.o2-network__viewport'),track=el.querySelector('.o2-network__track'),clone=el.querySelector('.o2-network__duplicate');
                    return {static:el.dataset.static,anim:getComputedStyle(track).animationName,scrollWidth:view.scrollWidth,clientWidth:view.clientWidth,overflow:getComputedStyle(view).overflowX,clone:getComputedStyle(clone).display,tab:view.getAttribute('tabindex'),left:view.scrollLeft};
                  });
                  console.log('LOGO PAUSED',JSON.stringify({width,lang,pause}));
                  assert(pause.static==='true'&&pause.anim==='none'&&pause.clone==='none'&&pause.tab==='0','pause shows one static accessible group '+width+'/'+lang);
                  assert(pause.scrollWidth>pause.clientWidth+300&&pause.overflow==='auto','paused logos manually scrollable '+width+'/'+lang);
                  assert(await toggle.getAttribute('aria-pressed')==='true','persistent pause state ARIA '+width+'/'+lang);
                  const view=network.locator('.o2-network__viewport');
                  await view.focus();
                  await page.keyboard.press('End');
                  const afterEnd=await view.evaluate(el=>({x:el.scrollLeft,max:el.scrollWidth-el.clientWidth}));
                  assert(afterEnd.x>=afterEnd.max-2,'all logos reachable by End '+width+'/'+lang);
                  await page.keyboard.press('Home');
                  assert(await view.evaluate(el=>el.scrollLeft)<2,'Home returns to first brand '+width+'/'+lang);
                  await page.keyboard.press('ArrowRight');
                  assert(await view.evaluate(el=>el.scrollLeft)>0,'arrow key manually browses logos '+width+'/'+lang);
                  await toggle.focus();
                  assert(await toggle.getAttribute('aria-pressed')==='true','pause persists after focus moves '+width+'/'+lang);
                  await page.mouse.move(0,0);
                  assert(await network.getAttribute('data-static')==='true','pause persists when pointer leaves '+width+'/'+lang);
                  await toggle.click();
                  assert(await network.getAttribute('data-static')==='false' && await toggle.getAttribute('aria-pressed')==='false','Play resumes marquee '+width+'/'+lang);
                  await network.locator('.o2-network__viewport').hover();
                  await page.waitForTimeout(180);
                  assert(await network.locator('.o2-network__track').evaluate(el=>getComputedStyle(el).animationPlayState)==='paused','hover pauses marquee '+width+'/'+lang);
                  await page.mouse.move(0,0);
                  await page.waitForTimeout(90);
                  assert(await network.locator('.o2-network__track').evaluate(el=>getComputedStyle(el).animationPlayState)==='running','marquee resumes after hover only when user has not paused '+width+'/'+lang);
                }
              }
              await page.setViewportSize({width:390,height:844});
              await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
              await page.waitForTimeout(1050);
              const initial=await network.evaluate(el=>{
                const rect=el.getBoundingClientRect();
                return {top:rect.top,bottom:rect.bottom,visible:getComputedStyle(el).opacity,scrollY:window.scrollY};
              });
              console.log('LOGO INITIAL VIEWPORT',JSON.stringify(initial));
              if(initial.top<844&&initial.bottom>0)assert(initial.visible==='1','strip visible in first viewport even with scrollY=0');
              const shots=await browser.newPage({viewport:{width:390,height:844}});
              await open(shots);
              await shots.locator('#o2-network').scrollIntoViewIfNeeded();
              await shots.locator('.o2-network__toggle').click();
              await shots.screenshot({path:'/tmp/ai-lab-logo/logo-mobile-paused.png'});
              const reduced=await browser.newPage({viewport:{width:320,height:780},reducedMotion:'reduce'});
              await open(reduced);
              await reduced.locator('#o2-network').scrollIntoViewIfNeeded();
              const rm=await reduced.locator('#o2-network').evaluate(el=>{
                const view=el.querySelector('.o2-network__viewport'),track=el.querySelector('.o2-network__track'),clone=el.querySelector('.o2-network__duplicate');
                return {static:el.dataset.static,animation:getComputedStyle(track).animationName,clone:getComputedStyle(clone).display,
                  scroll:view.scrollWidth-view.clientWidth,tab:view.getAttribute('tabindex'),control:el.querySelectorAll('.o2-network__toggle').length,
                  headingOpacity:getComputedStyle(el).opacity};
              });
              console.log('LOGO REDUCED',JSON.stringify(rm));
              assert(rm.static==='true'&&rm.animation==='none'&&rm.clone==='none'&&rm.scroll>300&&rm.tab==='0'&&rm.control===0,'reduced-motion static single group with manual access');
              assert(rm.headingOpacity==='1','reduced-motion section visible without reveal animation');
              await reduced.locator('.o2-network__viewport').focus();
              await reduced.keyboard.press('End');
              const end=await reduced.locator('.o2-network__viewport').evaluate(el=>el.scrollLeft);
              assert(end>300,'all ten logos accessible in reduced motion');
              await reduced.screenshot({path:'/tmp/ai-lab-logo/logo-reduced-motion.png'});
              console.log('LOGO STRIP V02 QA COMPLETE');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/ai-lab-logo/test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logo-strip-v02-qa
          path: /tmp/ai-lab-logo/*.png
          if-no-files-found: ignore
