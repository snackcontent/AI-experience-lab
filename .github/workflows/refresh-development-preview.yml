name: Refresh stable Development preview

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-preview-cache
  cancel-in-progress: true

jobs:
  refresh-preview:
    name: Purge cache and compare live branch, pinned and published preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose upstream and purge GitHack preview
        shell: bash
        env:
          PREVIEW_URL: https://raw.githack.com/snackcontent/AI-experience-lab/development/AI%20Experience%20Lab.dc.html
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/snackcontent/AI-experience-lab
          ENCODED='AI%20Experience%20Lab.dc.html'
          EXPECTED="$(sha256sum 'AI Experience Lab.dc.html' | cut -d' ' -f1)"
          echo "Development HEAD: ${GITHUB_SHA} HTML SHA256 ${EXPECTED}"
          for name in github-raw-branch githack-pinned githack-dev; do
            case "$name" in
              github-raw-branch) url="$BASE/development/$ENCODED";;
              githack-pinned) url="https://raw.githack.com/snackcontent/AI-experience-lab/${GITHUB_SHA}/$ENCODED";;
              githack-dev) url="$PREVIEW_URL";;
            esac
            curl -fsSL --retry 2 --max-time 40 -D "/tmp/$name.headers" "$url" -o "/tmp/$name.html"
            echo "$name: $(sha256sum "/tmp/$name.html" | cut -d' ' -f1) bytes=$(wc -c < "/tmp/$name.html")"
            grep -Ei '^(cache-control|age|etag|last-modified|cf-cache-status|content-type):' "/tmp/$name.headers" | tail -10 || true
          done
          # Regression: validate the exact SHA-pinned URL shared with the reviewer,
          # including the utm_source query string. A fragment is client-side only.
          QA_SHA=ba1ab29ab16618291f4fa28dbfcde596b231a49e
          QA_URL="https://raw.githack.com/snackcontent/AI-experience-lab/$QA_SHA/$ENCODED?utm_source=chatgpt.com"
          QA_RAW="$BASE/$QA_SHA/$ENCODED"
          curl -fsSL --max-time 40 "$QA_URL" -o /tmp/faq-user-pinned.html
          curl -fsSL --max-time 40 "$QA_RAW" -o /tmp/faq-github-pinned.html
          echo "Reviewer pinned URL $(sha256sum /tmp/faq-user-pinned.html | cut -d' ' -f1) - GitHub $(sha256sum /tmp/faq-github-pinned.html | cut -d' ' -f1)"
          cmp /tmp/faq-user-pinned.html /tmp/faq-github-pinned.html || { echo "::error::Reviewer pinned URL differs from GitHub"; exit 1; }
          grep -qF 'class="o2-faq-question"' /tmp/faq-user-pinned.html
          grep -qF 'font-size:18px!important' /tmp/faq-user-pinned.html
          grep -qF 'font-size:16px!important' /tmp/faq-user-pinned.html
          echo "The reviewer-pinned URL has the requested font CSS."
          echo "Purging original URL; query string does not affect file cache identity."
          curl -sS -X DELETE -w 'Purge HTTP %{http_code}\n' \
            "https://raw.githack.com/purge?url=https%3A%2F%2Fraw.githack.com%2Fsnackcontent%2FAI-experience-lab%2Fdevelopment%2FAI%2520Experience%2520Lab.dc.html"
          echo

      - name: Check whether canonical preview has reached the current source
        shell: bash
        env:
          PREVIEW_URL: https://raw.githack.com/snackcontent/AI-experience-lab/development/AI%20Experience%20Lab.dc.html
        run: |
          set -euo pipefail
          expected="$(sha256sum 'AI Experience Lab.dc.html' | cut -d' ' -f1)"
          for i in 1 2 3 4 5 6 7 8; do
            curl --fail-with-body --silent --show-error --location --max-time 45 \
              "$PREVIEW_URL" --output /tmp/ai-lab-preview.html
            observed="$(sha256sum /tmp/ai-lab-preview.html | cut -d' ' -f1)"
            if [ "$observed" = "$expected" ]; then
              echo "Verified: stable preview HTML matches current development commit"
              exit 0
            fi
            echo "Cached response still differs; attempt ${i}/8"
            sleep 8
          done
          echo "::error::Stable GitHack preview still serves an older version."
          echo "Repo=$expected Preview=$observed"
          exit 1
