name: Emoji Seekbar UI verification
on:
  push:
    branches: [development]
    paths:
      - 'AI Experience Lab.dc.html'
      - '.github/workflows/roadmap-emoji-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Playwright
        run: |
          mkdir -p /tmp/check-emoji
          cd /tmp/check-emoji
          npm init -y >/dev/null
          npm install --silent --no-save playwright
          npx playwright install chromium
      - name: Validate card and playback in Chromium
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/check-emoji/check.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const url='https://raw.githack.com/snackcontent/AI-experience-lab/'+process.env.BUILD_SHA+'/AI%20Experience%20Lab.dc.html#next';
            for(const width of [1440,390]){
              for(const motion of ['no-preference','reduce']){
                const page=await browser.newPage({viewport:{width,height:900},reducedMotion:motion});
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
                if((await page.title()).includes('External Content Notice')){
                  await page.getByRole('button',{name:'Open the page'}).click();
                }
                await page.locator('#next .cf-controls__arrow').first().waitFor({state:'visible'});
                let found=false;
                for(let i=0;i<19;i++){
                  const title=await page.locator('#next .cf-card[data-cf-active="true"]').innerText();
                  if(title.includes('AI Emoji Seekbar')){found=true;break;}
                  await page.locator('#next .cf-controls__arrow').nth(1).click({force:true});
                  await page.waitForTimeout(180);
                }
                if(!found)throw Error('Emoji card was not reached');
                await page.waitForTimeout(2000);
                const data=await page.evaluate(()=>{
                  const card=document.querySelector('#next .cf-card[data-cf-active="true"]');
                  const img=card.querySelector('.cf-emoji-visual__poster');
                  const vid=card.querySelector('.cf-emoji-visual__motion');
                  return {posterLoaded:!!img?.naturalWidth,videoCount:vid?1:0,ready:vid?.readyState??0,
                    time:vid?.currentTime??0,paused:vid?.paused??true,
                    sideVideos:document.querySelectorAll('#next .cf-card[data-cf-active="false"] .cf-emoji-visual__motion').length};
                });
                console.log('EMOJI CARD VERIFIED',JSON.stringify({width,motion,data}));
                if(!data.posterLoaded||data.sideVideos!==0)throw Error('Poster/side cards invalid');
                if(motion==='reduce'){if(data.videoCount)throw Error('Reduced-motion video should be absent')}
                else if(data.videoCount!==1||data.ready<2||data.paused||data.time<.05)throw Error('Active video not playing');
                await page.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          cd /tmp/check-emoji
          node check.cjs
