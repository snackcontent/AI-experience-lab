name: FAQ rendered typography QA

on:
  push:
    branches: [development]
    paths:
      - 'AI Experience Lab.dc.html'
      - '.github/workflows/faq-render-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  faq-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          mkdir -p /tmp/ai-lab-faq-qa
          cd /tmp/ai-lab-faq-qa
          npm init -y >/dev/null
          npm install --no-save --silent playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            npx playwright install --with-deps chromium
          fi

      - name: Inspect rendered computed styles in live browser
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/ai-lab-faq-qa/verify.cjs <<'JS'
          const {chromium} = require('playwright');
          const fs = require('fs');
          (async () => {
            let browser;
            try {
              const candidate = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'];
              const executablePath = candidate.find(p => fs.existsSync(p));
              browser = await chromium.launch({headless:true, ...(executablePath ? {executablePath} : {}),args:['--no-sandbox']});
              const sha = process.env.COMMIT_SHA;
              const url = 'https://raw.githack.com/snackcontent/AI-experience-lab/'+sha+'/AI%20Experience%20Lab.dc.html#o2-faq';
              let failed = false;
              for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
                const page = await browser.newPage({viewport});
                page.on('pageerror', e => console.log('PAGE ERROR:',e.message));
                console.log('Loading',url,'viewport',viewport.width);
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
                await page.waitForTimeout(6000);
                await page.waitForSelector('#o2-faq .o2-faq-question',{state:'visible',timeout:60000});
                await page.locator('#o2-faq').scrollIntoViewIfNeeded();
                await page.evaluate(()=>document.fonts.ready);
                const info = await page.evaluate(()=>{
                  const q=document.querySelector('#o2-faq .o2-faq-question');
                  const answer=document.querySelector('#o2-faq .o2-faq-answer-inner p');
                  const faq=document.querySelector('#o2-faq');
                  const desktop=document.querySelector('#o2-faq .o2-faq-support--desktop');
                  const mobile=document.querySelector('#o2-faq .o2-faq-support--mobile');
                  const qs=getComputedStyle(q),as=getComputedStyle(answer);
                  return {question:qs.fontSize,questionWeight:qs.fontWeight,questionFamily:qs.fontFamily,answer:as.fontSize,answerWeight:as.fontWeight,answerLineHeight:as.lineHeight,questionText:q.textContent.trim(),answerText:answer.textContent.slice(0,80),faqVisible:faq.getBoundingClientRect().height>0,desktopSupport:getComputedStyle(desktop).display,mobileSupport:getComputedStyle(mobile).display,dpr:window.devicePixelRatio};
                });
                console.log('ACTUAL COMPUTED FAQ',JSON.stringify({viewport,info}));
                const filename='/tmp/ai-lab-faq-qa/faq-'+viewport.width+'.png';
                await page.locator('#o2-faq').screenshot({path:filename,timeout:60000});
                if(info.question!=='18px' || info.answer!=='16px'){console.error('CSS MISMATCH: text sizes must be 18px/16px.');failed=true}
                if(!info.faqVisible){console.error('FAQ NOT VISIBLE');failed=true}
                await page.close();
              }
              if(failed)process.exitCode=1;
            }catch(e){console.error('BROWSER TEST ERROR',e);process.exitCode=1}
            finally{if(browser)await browser.close();}
          })();
          JS
          cd /tmp/ai-lab-faq-qa
          node verify.cjs

      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faq-browser-screenshots
          path: /tmp/ai-lab-faq-qa/faq-*.png
          if-no-files-found: ignore
