name: FAQ rendered typography QA

on:
  push:
    branches: [development]
    paths:
      - 'AI Experience Lab.dc.html'
      - '.github/workflows/faq-render-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  faq-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          mkdir -p /tmp/ai-lab-faq-qa
          cd /tmp/ai-lab-faq-qa
          npm init -y >/dev/null
          npm install --no-save --silent playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            npx playwright install --with-deps chromium
          fi

      - name: Inspect rendered computed styles in live browser
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/ai-lab-faq-qa/verify.cjs <<'JS'
          const {chromium} = require('playwright');
          const fs = require('fs');
          (async () => {
            let browser;
            try {
              const candidate = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'];
              const executablePath = candidate.find(p => fs.existsSync(p));
              browser = await chromium.launch({headless:true, ...(executablePath ? {executablePath} : {}),args:['--no-sandbox']});
              const sha = process.env.COMMIT_SHA;
              const url = 'https://raw.githack.com/snackcontent/AI-experience-lab/'+sha+'/AI%20Experience%20Lab.dc.html#o2-faq';
              let failed = false;
              for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
                const page = await browser.newPage({viewport});
                page.on('pageerror', e => console.log('PAGE ERROR:',e.message));
                console.log('Loading',url,'viewport',viewport.width);
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
                if((await page.title()).includes('External Content Notice')){
                  const links=await page.locator('a').evaluateAll(elements=>elements.map(el=>({label:el.innerText?.trim(),href:el.href})).filter(x=>x.label).slice(0,20));
                  console.log('GITHACK INTERSTITIAL',JSON.stringify({url:page.url(),links}));
                  const buttons=await page.locator('button,input[type=submit],form').evaluateAll(elements=>elements.map(el=>({tag:el.tagName,text:el.innerText?.trim(),action:el.action,outer:el.outerHTML.slice(0,400)})).slice(0,8));
                  console.log('INTERSTITIAL CONTROLS',JSON.stringify(buttons));
                  const open=page.getByRole('button',{name:'Open the page'});
                  if(await open.count()){
                    await open.first().click({timeout:15000});
                    console.log('INTERSTITIAL OPENED',page.url());
                  } else {
                    console.log('No Open the page button found');
                  }
                }
                await page.waitForTimeout(9000);
                const docInfo=await page.evaluate(()=>{
                  const root=document.querySelector('x-dc');
                  const shadow=root?.shadowRoot;
                  return {readyState:document.readyState,title:document.title,
                    customElementDefined:!!customElements.get('x-dc'),
                    xdcChildren:root?.children.length,
                    hasShadow:!!shadow,shadowChildren:shadow?.children.length,
                    rootFaqElements:document.querySelectorAll('#o2-faq .o2-faq-question').length,
                    shadowFaqElements:shadow?.querySelectorAll('#o2-faq .o2-faq-question').length,
                    scripts:Array.from(document.scripts).map(x=>x.src).slice(0,20),
                    bodyText:document.body?.innerText?.slice(-1100),
                    bodyHtmlStart:document.body?.innerHTML?.slice(0,300)
                  };
                });
                console.log('DOCUMENT DIAGNOSTIC',JSON.stringify(docInfo));
                // Font regression test: check actual rendered glyph containers and Google Font loading.
                const typography=await page.evaluate(async()=>{
                  await document.fonts.load('400 18px "Almarai"','English عربي');
                  await document.fonts.load('700 18px "Almarai"','Arabic عربي');
                  await document.fonts.ready;
                  const selectors={
                    body:'body',
                    faqQuestion:'#o2-faq .o2-faq-question .sc-interp',
                    faqAnswer:'#o2-faq .o2-faq-answer-inner p .sc-interp',
                    faqHeading:'#o2-faq h2',
                    faqContact:'#o2-faq .o2-faq-contact',
                    hero:'#o2-top h1',
                    roadmap:'#next h2',
                    formInput:'#o2-contact input'
                  };
                  const families=Object.fromEntries(Object.entries(selectors).map(([key,sel])=>{
                    const el=document.querySelector(sel);
                    return [key,el?getComputedStyle(el).fontFamily:null];
                  }));
                  const importEl=document.querySelector('link[href*="fonts.googleapis.com/css2?family=Almarai"]');
                  return {fontUrl:importEl?.href||null,fonts:Array.from(document.fonts).filter(f=>f.family.toLowerCase().includes('almarai')).map(f=>({family:f.family,weight:f.weight,status:f.status})),latinReady:document.fonts.check('400 18px "Almarai"','English sample'),arabicReady:document.fonts.check('700 18px "Almarai"','مرحبا بالعالم'),families};
                });
                console.log('GOOGLE ALMARAI FONT AUDIT',JSON.stringify({viewport,typography}));
                const requiredFamilies=['body','faqQuestion','faqAnswer','faqHeading','faqContact'];
                if(!typography.fontUrl||!typography.latinReady||!typography.arabicReady
                   ||typography.fonts.length===0||!typography.fonts.some(f=>f.status==='loaded')
                   ||requiredFamilies.some(k=>!typography.families[k]||!typography.families[k].includes('Almarai'))){
                   console.error('SITE FONT REGRESSION: Google Fonts Almarai not applied/loaded');failed=true;
                }

                console.log('LOCATOR COUNTS',JSON.stringify({faq:await page.locator('#o2-faq').count(),
                  question:await page.locator('#o2-faq .o2-faq-question').count(),
                  visibleQuestion:await page.locator('#o2-faq .o2-faq-question:visible').count(),
                  legacyFaq:await page.locator('#faq').count()}));
                await page.screenshot({path:'/tmp/ai-lab-faq-qa/faq-'+viewport.width+'.png',fullPage:false,timeout:60000});
                if(await page.locator('#o2-faq .o2-faq-question:visible').count()){
                  const q=page.locator('#o2-faq .o2-faq-question:visible').first();
                  const ans=page.locator('#o2-faq .o2-faq-answer-inner p').first();
                  const info=await q.evaluate(el=>{
                    const inner=el.querySelector('span.sc-interp') || el;
                    return {outerSize:getComputedStyle(el).fontSize,fontSize:getComputedStyle(inner).fontSize,
                      outerWeight:getComputedStyle(el).fontWeight,weight:getComputedStyle(inner).fontWeight,
                      text:inner.textContent.trim(),family:getComputedStyle(inner).fontFamily,
                      innerTag:inner.tagName,innerClass:inner.className};
                  });
                  const answerInfo=await ans.evaluate(el=>{
                    const inner=el.querySelector('span.sc-interp') || el;
                    return {outerSize:getComputedStyle(el).fontSize,fontSize:getComputedStyle(inner).fontSize,
                      lineHeight:getComputedStyle(inner).lineHeight,innerClass:inner.className};
                  });
                  console.log('ACTUAL COMPUTED FAQ TEXT',JSON.stringify({viewport,question:info,answer:answerInfo}));
                  if(info.fontSize!=='18px'||info.weight!=='700'||answerInfo.fontSize!=='16px'){
                    console.error('TEXT OVERRIDE: generated span has unexpected computed typography');
                    failed=true;
                  }
                  const styleInfo=await page.locator('#o2-faq').evaluate(section=>{
                    const list=section.querySelector('.o2-faq-list');
                    const cards=Array.from(section.querySelectorAll('.o2-faq-card'));
                    const active=cards.find(el=>el.getAttribute('data-open')==='true');
                    const icon=active.querySelector('.o2-faq-toggle-icon');
                    const activeStyle=getComputedStyle(active);
                    const edge=getComputedStyle(active,'::after');
                    const wash=getComputedStyle(active,'::before');
                    return {listGap:getComputedStyle(list).gap,listBorderTop:getComputedStyle(list).borderTopWidth,
                      cardRadius:activeStyle.borderRadius,cardBorderBottom:activeStyle.borderBottomWidth,
                      iconWidth:getComputedStyle(icon).width,iconHeight:getComputedStyle(icon).height,
                      edgeTransform:edge.transform,washOpacity:wash.opacity,
                      activeCount:cards.filter(el=>el.getAttribute('data-open')==='true').length,
                      visibleNumbers:section.querySelectorAll('.o2-faq-index').length,
                      rowWidth:active.querySelector('button').getBoundingClientRect().width,
                      cardWidth:active.getBoundingClientRect().width};
                  });
                  console.log('ORIGINAL ACCORDION STYLE',JSON.stringify({viewport,styleInfo}));
                  if(styleInfo.listGap!=='0px'||styleInfo.cardRadius!=='0px'
                    ||styleInfo.cardBorderBottom!=='1px'||styleInfo.iconWidth!=='38px'
                    ||styleInfo.activeCount!==1||styleInfo.visibleNumbers!==0
                    ||styleInfo.rowWidth < styleInfo.cardWidth-2
                    ||styleInfo.washOpacity!=='1'
                    ||styleInfo.edgeTransform==='matrix(1, 0, 0, 0, 0, 0)'){
                    console.error('ACCORDION STYLE MISMATCH');failed=true;
                  }
                  // The second question must become the only expanded row.
                  await page.locator('#o2-faq .o2-faq-item-button').nth(1).click();
                  await page.waitForTimeout(750);
                  const opens=await page.locator('#o2-faq .o2-faq-card[data-open="true"]').count();
                  const secondOpen=await page.locator('#o2-faq .o2-faq-item-button').nth(1).getAttribute('aria-expanded');
                  console.log('ACCORDION TOGGLE',JSON.stringify({opens,secondOpen}));
                  if(opens!==1||secondOpen!=='true'){console.error('SINGLE OPEN REGRESSION');failed=true;}
                  await page.locator('#o2-faq .o2-faq-item-button').first().click();
                  await page.waitForTimeout(750);
                  await page.locator('#o2-faq').screenshot({path:'/tmp/ai-lab-faq-qa/faq-'+viewport.width+'.png',timeout:60000});
                } else {
                  console.log('FAQ NOT VISIBLE in Chromium. Captured diagnostic page screenshot.');
                  failed=true;
                }
                await page.close();
              }
              if(failed)process.exitCode=1;
            }catch(e){console.error('BROWSER TEST ERROR',e);process.exitCode=1}
            finally{if(browser)await browser.close();}
          })();
          JS
          cd /tmp/ai-lab-faq-qa
          node verify.cjs

      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faq-browser-screenshots
          path: /tmp/ai-lab-faq-qa/faq-*.png
          if-no-files-found: ignore
